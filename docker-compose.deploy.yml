services:
  vllm:
    image: ${SILO_VLLM_IMAGE:-vllm/vllm-openai:v0.11.2}
    container_name: silo-vllm
    # vLLM usa /dev/shm para comunicacao entre processos (padrao de 64 MB
    # e insuficiente -> "Insufficient space in /dev/shm").
    shm_size: "2gb"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.85}"
      - "--enable-prefix-caching"
    volumes:
      - silo-vllm-cache:/root/.cache/huggingface
      - silo-vllm-compile-cache:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  vllm-embed:
    # vLLM serve um modelo por instancia; servico dedicado para o embedding.
    image: ${SILO_VLLM_IMAGE:-vllm/vllm-openai:v0.11.2}
    container_name: silo-vllm-embed
    shm_size: "2gb"
    ports:
      - "${VLLM_EMBED_PORT:-8001}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - "--model"
      - "${VLLM_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}"
      - "--max-model-len"
      - "512"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.85}"
      - "--enable-prefix-caching"
    volumes:
      - silo-vllm-cache:/root/.cache/huggingface
      - silo-vllm-compile-cache:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  migrate:
    image: ${SILO_IMAGE:-silo-api-python:latest}
    container_name: silo-api-python-migrate
    command: ["python", "-m", "silo.db.migrate"]
    environment:
      SILO_ENV: ${SILO_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_URL_PROD: ${APP_URL_PROD:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRODUCT_FLOW_API_KEY: ${PRODUCT_FLOW_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_TRACING_APPROVED: ${LANGSMITH_TRACING_APPROVED:-false}
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-false}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      VLLM_EMBEDDING_URL: ${VLLM_EMBEDDING_URL:-http://vllm-embed:8000/v1}
      VLLM_TIMEOUT_MS: ${VLLM_TIMEOUT_MS:-180000}
      VLLM_MAX_CONCURRENT_REQUESTS: ${VLLM_MAX_CONCURRENT_REQUESTS:-4}
      UPLOADS_DIR: /app/uploads
      TZ: America/Sao_Paulo
    # Em producao o banco e externo/gerenciado, portanto nao ha servico `db`
    # neste compose para aguardar. Garantir que o PostgreSQL esteja acessivel
    # antes do `up`; a conexao e validada no boot do migrate.
    restart: "no"

  api:
    image: ${SILO_IMAGE:-silo-api-python:latest}
    container_name: silo-api-python
    ports:
      - "${API_PORT:-4000}:4000"
    command: ["uvicorn", "silo.api.main:app", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      SILO_ENV: ${SILO_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      AI_AGENT_MODE: ${AI_AGENT_MODE:-deterministic}
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-}
      APP_URL_PROD: ${APP_URL_PROD:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_TRACING_APPROVED: ${LANGSMITH_TRACING_APPROVED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRODUCT_FLOW_API_KEY: ${PRODUCT_FLOW_API_KEY:-}
      UPLOADS_DIR: /app/uploads
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-false}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      VLLM_EMBEDDING_URL: ${VLLM_EMBEDDING_URL:-http://vllm-embed:8000/v1}
      VLLM_TIMEOUT_MS: ${VLLM_TIMEOUT_MS:-180000}
      VLLM_MAX_CONCURRENT_REQUESTS: ${VLLM_MAX_CONCURRENT_REQUESTS:-4}
      TZ: America/Sao_Paulo
    volumes:
      - silo-storage-data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/live', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 90s
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped

  worker:
    image: ${SILO_IMAGE:-silo-api-python:latest}
    container_name: silo-worker-python
    command: ["python", "-m", "silo.worker.main"]
    environment:
      SILO_ENV: ${SILO_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-}
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-false}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      TZ: America/Sao_Paulo
      WORKER_HEALTH_STATE_PATH: /tmp/silo-worker-health.json
      WORKER_HEALTH_STALE_SECONDS: "30"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "silo.worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 90s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped

volumes:
  silo-storage-data:
    name: silo-storage-data
  silo-vllm-cache:
    name: silo-vllm-cache
  silo-vllm-compile-cache:
    name: silo-vllm-compile-cache

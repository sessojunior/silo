name: inference

services:
  qwen:
    image: ${SILO_VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:v0.29.0-x86_64}
    container_name: qwen
    networks:
      shared-inference:
        aliases:
          - qwen
    shm_size: "2gb"
    ports:
      - "${QWEN_BIND_ADDRESS:-127.0.0.1}:${QWEN_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - "--model"
      - "${QWEN_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--served-model-name"
      - "${QWEN_SERVED_MODEL:-qwen}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      # Keep the CPU profile within the small local Docker memory budget.
      # Use a separate variable so a GPU-oriented QWEN_MAX_MODEL_LEN in .env
      # cannot accidentally make the local CPU profile exceed its budget.
      - "${QWEN_CPU_MAX_MODEL_LEN:-2048}"
      # vLLM reuses this flag for the fraction of host memory reserved by its
      # CPU backend. Keep the local default below the 0.92 upstream default so
      # Qwen can coexist with PostgreSQL, API, embeddings and the worker.
      - "--gpu-memory-utilization"
      - "${QWEN_CPU_MEMORY_UTILIZATION:-0.20}"
      # Avoid the large CPU JIT warm-up peak in the constrained local profile.
      - "--enforce-eager"
      - "--no-enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    volumes:
      - qwen-huggingface-cache:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: "8g"
    cpus: "4.0"
    restart: unless-stopped

volumes:
  qwen-huggingface-cache:
  qwen-vllm-cache:

networks:
  shared-inference:
    name: shared-inference

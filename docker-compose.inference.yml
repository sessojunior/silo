name: inference

services:
  qwen:
    image: ${QWEN_IMAGE:-vllm/vllm-openai:v0.29.0}
    container_name: qwen
    networks:
      shared-inference:
        aliases:
          - qwen
    shm_size: "2gb"
    ports:
      - "${QWEN_BIND_ADDRESS:-127.0.0.1}:${QWEN_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - "--model"
      - "${QWEN_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--served-model-name"
      - "${QWEN_SERVED_MODEL:-qwen}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "${QWEN_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.70}"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    volumes:
      - qwen-huggingface-cache:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: "8g"
    cpus: "4.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN_GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qwen-huggingface-cache:
  qwen-vllm-cache:

networks:
  shared-inference:
    name: shared-inference

services:
  db:
    image: ${SILO_POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:f193b9c848deb27b0e892f85ed07b53fd83ccb1feb634ba415b1cdc44411bedc}
    container_name: silo-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-silo}
      POSTGRES_USER: ${POSTGRES_USER:-silo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silo}
    volumes:
      - silo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-silo} -d ${POSTGRES_DB:-silo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vllm:
    image: ${SILO_VLLM_IMAGE:-vllm/vllm-openai:v0.11.2}
    container_name: silo-vllm
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.85}"
      - "--enable-prefix-caching"
    volumes:
      - silo-vllm-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    # Descomente para usar GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    image: silo-api-python
    container_name: silo-api-python-migrate
    command: ["python", "-m", "silo.db.migrate"]
    environment:
      SILO_ENV: ${SILO_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://silo:silo@db:5432/silo}
      APP_URL_DEV: ${APP_URL_DEV:-http://localhost}
      APP_URL_PROD: ${APP_URL_PROD:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_TRACING_APPROVED: ${LANGSMITH_TRACING_APPROVED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRODUCT_FLOW_API_KEY: ${PRODUCT_FLOW_API_KEY:-}
      UPLOADS_DIR: /app/uploads
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-http://localhost:8082}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-true}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      VLLM_TIMEOUT_MS: ${VLLM_TIMEOUT_MS:-30000}
      VLLM_MAX_CONCURRENT_REQUESTS: ${VLLM_MAX_CONCURRENT_REQUESTS:-4}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    image: silo-api-python
    container_name: silo-api-python
    ports:
      - "${API_PORT:-4000}:4000"
    command: ["uvicorn", "silo.api.main:app", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      SILO_ENV: ${SILO_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      AI_AGENT_MODE: ${AI_AGENT_MODE:-deterministic}
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://silo:silo@db:5432/silo}
      APP_URL_DEV: ${APP_URL_DEV:-http://localhost}
      APP_URL_PROD: ${APP_URL_PROD:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_TRACING_APPROVED: ${LANGSMITH_TRACING_APPROVED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRODUCT_FLOW_API_KEY: ${PRODUCT_FLOW_API_KEY:-}
      UPLOADS_DIR: /app/uploads
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-http://localhost:8082}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-true}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      VLLM_TIMEOUT_MS: ${VLLM_TIMEOUT_MS:-30000}
      VLLM_MAX_CONCURRENT_REQUESTS: ${VLLM_MAX_CONCURRENT_REQUESTS:-4}
      TZ: America/Sao_Paulo
    volumes:
      - silo-storage-data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/live', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 90s
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: worker
    image: silo-worker-python
    container_name: silo-worker-python
    environment:
      SILO_ENV: ${SILO_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://silo:silo@db:5432/silo}
      KAFKA_REST_PROXY_URL: ${KAFKA_REST_PROXY_URL:-http://localhost:8082}
      KAFKA_REST_PROXY_AUTH: ${KAFKA_REST_PROXY_AUTH:-}
      KAFKA_REST_PROXY_USE_MOCK_DATA: ${KAFKA_REST_PROXY_USE_MOCK_DATA:-true}
      KAFKA_DATAFLOW_TOPIC_PREFIX: ${KAFKA_DATAFLOW_TOPIC_PREFIX:-silo.dataflow.}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-silo-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-}
      KAFKA_DLQ_PREFIX: ${KAFKA_DLQ_PREFIX:-dlq.}
      KAFKA_PROCESS_RETRY_COUNT: ${KAFKA_PROCESS_RETRY_COUNT:-3}
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-1000}
      TZ: America/Sao_Paulo
      WORKER_HEALTH_STATE_PATH: /tmp/silo-worker-health.json
      WORKER_HEALTH_STALE_SECONDS: "30"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "silo.worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 90s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:4000}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
        APP_URL_DEV: ${APP_URL_DEV:-http://localhost}
        APP_URL_PROD: ${APP_URL_PROD:-http://localhost}
    image: silo-web
    container_name: silo-web
    ports:
      - "${SILO_HOST_PORT:-80}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_URL: http://api:4000
      APP_URL_DEV: ${APP_URL_DEV:-http://localhost}
      APP_URL_PROD: ${APP_URL_PROD:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/silo}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:4000}
      TZ: America/Sao_Paulo
    volumes:
      - silo-storage-data:/app/uploads
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - default
    stop_grace_period: 45s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped

volumes:
  silo-postgres-data:
    name: silo-postgres-data
  silo-storage-data:
    name: silo-storage-data
  silo-vllm-cache:
    name: silo-vllm-cache

networks:
  frontend:
    driver: bridge
